# ToolBox 自动构建与发布（B5 用户优化项）：
# - push v* tag 或手动触发 → Windows 构建 → cargo test / lint → tauri build（NSIS）
# - 自动生成 updater 清单（latest.json）并发布到 GitHub Releases（B4 自动更新数据源）
#
# 首次使用前需在仓库 Settings → Secrets and variables → Actions 配置：
#   TAURI_SIGNING_PRIVATE_KEY          = %USERPROFILE%\.tauri\toolbox-updater.key 的内容
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD = tb-updater-key
# 并将 tauri.conf.json 的 updater.endpoints 中的 YOUR_NAME/YOUR_REPO 替换为真实仓库。

name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Lint (oxlint)
        run: pnpm lint

      - name: Typecheck + frontend build
        run: pnpm build

      - name: Rust tests (workspace)
        run: cargo test --workspace

      # beforeBuildCommand 会先 build:core:release（核心插件 DLL + UI）再构建前端；
      # updater 产物（.sig）需要签名私钥，未配置 secrets 时此步会失败
      - name: Build release (NSIS + updater artifacts)
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # updater 清单：version/signature/url → latest.json（应用内 check() 读取的元数据）
      - name: Generate updater manifest (latest.json)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE=src-tauri/target/release/bundle/nsis
          VERSION="${GITHUB_REF_NAME#v}"
          EXE=$(ls "$BUNDLE"/*-setup.exe | xargs -n1 basename)
          SIG=$(cat "$BUNDLE"/*.sig)
          cat > "$BUNDLE/latest.json" <<EOF
          {
            "version": "$VERSION",
            "notes": "自动构建发布 v$VERSION",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "$SIG",
                "url": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$EXE"
              }
            }
          }
          EOF
          echo "latest.json:"
          cat "$BUNDLE/latest.json"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/latest.json
