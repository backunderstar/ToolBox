# ToolBox 轻量 CI：每次 push（main/master）与 PR 自动验证
#   lint（oxlint）→ typecheck（tsc）→ 前端构建（vite）→ Rust 测试（workspace）
# 不构建安装包、不做签名（那是 build-release.yml 的职责，v* tag / 手动触发）。
# 让日常提交进主干前就有防线，避免回归。

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# 同分支并发只留最新（PR 反复提交时取消旧任务，省 runner 时间）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 不传 version：以 package.json 的 packageManager（pnpm@10.28.1）为唯一
      # 版本来源，避免与 corepack 的 ERR_PNPM_BAD_PM_VERSION 冲突
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # Cargo workspace 在仓库根（Cargo.lock 在根、target 在 ./target），
      # 用默认缓存布局（"." -> "target"），显式 workspaces 指向 src-tauri 会 miss
      - uses: swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # tauri 构建脚本编译期校验 bundle.resources 路径（resources/python 与
      # resources/bundled-plugins 已加入配置）；CI 测试用系统 Python（windows-latest
      # 自带），只需占位目录即可通过编译，无需下载 47MB 捆绑运行时（release 流程
      # 才真实 fetch/构建，见 build-release.yml / bundle:plugins）。
      - name: Create bundled resource placeholders
        run: New-Item -ItemType Directory -Force src-tauri/resources/python, src-tauri/resources/bundled-plugins | Out-Null

      - name: Lint (oxlint)
        run: pnpm lint

      - name: Typecheck + frontend build
        run: pnpm build

      - name: Frontend unit tests (vitest)
        run: pnpm test

      - name: Clippy (workspace, warnings denied, deps excluded)
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings

      - name: Rust tests (workspace)
        run: cargo test --workspace

      # 依赖漏洞审计（pnpm 官方 registry；high/critical 才阻塞，
      # 低危 advisory 不打断常规开发）
      - name: Dependency audit (pnpm)
        run: pnpm audit --audit-level=high
