# ToolBox workspace：宿主（src-tauri）+ 核心插件 SDK + 核心插件（cdylib）。
#
# 核心插件以动态库形式随应用分发，宿主经 libloading + C ABI 加载：
# 性能接近进程内直接调用（FFI + JSON 序列化，微秒级），
# 同时保持"插件"形态——可启用/禁用/热重载/被替换。
# 搜索/备份/文件服务已迁回宿主本体框架（core/search.rs + core/backup.rs + core/files.rs）。
# 教学基线：核心插件仅保留一个教学示例 core-example（core-plugins/example），
# 新核心插件照它实现（见 docs/核心插件示例教程.md）。
[workspace]
resolver = "2"
members = ["src-tauri", "tb-sdk", "core-plugins/example"]

# workspace 级 lint：linker_messages 放行——MSVC link.exe 每次链接都往 stdout 写
# "正在创建库 ... 和对象 ..."（创建 .lib/.exp 的正常提示），被该 lint 当成警告刷屏
# （HANDOVER §6.2 曾记录为"PowerShell 误报"，实际是此 lint 捕获的噪音）。
[workspace.lints.rust]
linker_messages = "allow"

# 发布优化（所有 member 生效）：thin LTO 平衡编译时间与体积/性能，
# strip 去除符号表显著减小安装包（插件 DLL 与宿主均受益）。
[profile.release]
lto = "thin"
strip = true
