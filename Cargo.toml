# ToolBox workspace：宿主（src-tauri）+ 核心插件 SDK + 核心插件（cdylib）。
#
# 核心插件以动态库形式随应用分发，宿主经 libloading + C ABI 加载：
# 性能接近进程内直接调用（FFI + JSON 序列化，微秒级），
# 同时保持"插件"形态——可启用/禁用/热重载/被替换。
# 搜索/备份已迁回宿主本体（core/search.rs + core/backup.rs），不在此列。
[workspace]
resolver = "2"
members = ["src-tauri", "tb-sdk", "core-plugins/notes", "core-plugins/todos", "core-plugins/checklists", "core-plugins/projects", "core-plugins/blog", "core-plugins/ai"]

# 发布优化（所有 member 生效）：thin LTO 平衡编译时间与体积/性能，
# strip 去除符号表显著减小安装包（插件 DLL 与宿主均受益）。
[profile.release]
lto = "thin"
strip = true
