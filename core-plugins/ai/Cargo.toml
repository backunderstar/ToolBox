[package]
name = "tb-ai"
version = "0.1.0"
description = "ToolBox 核心插件：AI 网关（OpenAI 兼容对话 + SSE 流式 + keyring 凭据）"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
tb-sdk = { path = "../../tb-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 网络（blocking 对话 + async 流式 SSE）：0.13 起 rustls-tls 拆分为
# rustls + webpki-roots（内置证书包，对应 0.12 的 rustls-tls 语义）
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "webpki-roots", "stream"] }
futures-util = "0.3"
bytes = "1"
# API Key 安全存储：Windows 凭据管理器等
keyring = { version = "3", features = ["windows-native", "crypto-rust"] }
# 流式需要 tokio 运行时（插件内自建，与宿主解耦）
tokio = { version = "1", features = ["rt-multi-thread"] }
