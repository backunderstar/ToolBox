[package]
name = "tb-blog"
version = "0.1.0"
description = "ToolBox 核心插件：博客发布（frontmatter/站点生成/内置预览服务器）"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
tb-sdk = { path = "../../tb-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.12"
tiny_http = "0.12"
