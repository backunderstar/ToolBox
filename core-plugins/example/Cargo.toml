[package]
name = "tb-example"
version = "0.4.1"
description = "ToolBox 核心插件教学示例：覆盖命令/事件/搜索提供者/宿主能力/自带前端全部实现要点"
edition = "2021"

# 继承 workspace lints（linker_messages 放行等，见根 Cargo.toml [workspace.lints]）
[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
tb-sdk = { path = "../../tb-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
