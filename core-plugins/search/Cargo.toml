[package]
name = "tb-search"
version = "0.1.0"
description = "ToolBox 核心插件：全文搜索（SQLite FTS5 trigram 索引）"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
tb-sdk = { path = "../../tb-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled-full"] }
