<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Vditor 调试页</title>
    <link rel="stylesheet" href="/vditor/dist/index.css" />
    <script src="/vditor/dist/index.js"></script>
    <style>
      body { margin: 0; font-family: sans-serif; background: #f6f5f2; }
      #editor { height: 60vh; margin: 24px; }
      #log { margin: 0 24px 24px; font-family: monospace; font-size: 12px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="editor"></div>
    <div id="log"></div>
    <script>
      var logEl = document.getElementById("log");
      function log(msg) {
        logEl.textContent += msg + "\n";
        console.log("[debug]", msg);
      }
      window.addEventListener("error", function (e) {
        log("WINDOW-ERROR: " + e.message + " @ " + e.filename + ":" + e.lineno + " err=" + (e.error && e.error.stack));
      });
      window.addEventListener("unhandledrejection", function (e) {
        var r = e.reason;
        log("UNHANDLED-REJECTION: proto=" + (r && Object.getPrototypeOf(r) && Object.getPrototypeOf(r).constructor && Object.getPrototypeOf(r).constructor.name) + " keys=" + (r && typeof r === "object" ? JSON.stringify(Object.keys(r)) : "") + " str=" + String(r));
      });
      window.addEventListener("error", function (e) {
        var t = e.target;
        if (t && (t.tagName === "SCRIPT" || t.tagName === "LINK" || t.tagName === "IMG")) {
          log("RESOURCE-ERROR: <" + t.tagName + "> " + (t.src || t.href || "?"));
        }
      }, true);

      log("Vditor 版本: " + (window.Vditor && Vditor.prototype && Vditor.prototype.version));
      try {
        var vd = new Vditor(document.getElementById("editor"), {
          height: "100%",
          mode: "ir",
          theme: "classic",
          lang: "zh_CN",
          icon: "ant",
          cdn: "/vditor",
          placeholder: "调试页",
          value: "# 你好\n\n这是一个调试用示例。\n\n- 列表一\n- 列表二\n\n```js\nconsole.log(1)\n```\n\n> 引用内容\n\n**加粗** $E=mc^2$",
          cache: { enable: false },
          counter: { enable: false },
          outline: { enable: false, position: "right" },
          toolbar: ["undo", "redo", "|", "headings", "bold", "italic", "strike", "|", "list", "ordered-list", "check", "|", "quote", "inline-code", "code", "link", "table", "|", "edit-mode", "fullscreen"],
          input: function (value) { log("INPUT(len=" + value.length + ")"); },
          blur: function () { log("BLUR"); },
          after: function () { log("AFTER 编辑器就绪"); }
        });
        window.__vd = vd;
        log("构造完成，等待异步初始化…");
      } catch (err) {
        log("构造抛错: " + err.message + "\n" + err.stack);
      }

      setTimeout(function () {
        var ir = document.querySelector(".vditor-ir");
        log("--- 3 秒后状态 ---");
        log("vditor 容器: " + !!document.querySelector(".vditor"));
        log("ir 区域: " + !!ir);
        log("ir contenteditable: " + (ir && ir.getAttribute("contenteditable")));
        log("工具栏按钮数: " + document.querySelectorAll(".vditor-toolbar button").length);
        log("编辑器文本长度: " + (ir ? ir.innerText.length : -1));
        if (ir) {
          ir.focus();
          try {
            document.execCommand("insertText", false, "【模拟输入】");
            log("模拟输入后文本长度: " + ir.innerText.length);
          } catch (err) {
            log("模拟输入抛错: " + err.message);
          }
        }
      }, 3000);
    </script>
  </body>
</html>
