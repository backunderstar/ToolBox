<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Vditor 布局测量</title>
    <link rel="stylesheet" href="/vditor/dist/index.css" />
    <script src="/vditor/dist/index.js"></script>
    <style>
      html, body { height: 100%; margin: 0; }
      .app { display: flex; flex-direction: column; height: 100vh; }
      .topbar { height: 48px; flex-shrink: 0; border-bottom: 1px solid #e7e4dd; }
      .body { display: flex; flex: 1; min-height: 0; }
      .sidebar { width: 224px; flex-shrink: 0; border-right: 1px solid #e7e4dd; }
      .main { flex: 1; min-width: 0; overflow: hidden; }
      .notes { display: flex; height: 100%; min-height: 0; background: #ffffff; }
      .files-pane { width: 240px; flex-shrink: 0; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid #e7e4dd; background: #fbfbfa; }
      .editor-area { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
      .editor-header { display: flex; align-items: center; padding: 8px 24px; border-bottom: 1px solid #e7e4dd; background: #fbfbfa; height: 36px; box-sizing: border-box; }
      .editor-body { flex: 1; min-height: 0; overflow: hidden; }
      .editor-host { height: 100%; }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar"></div>
      <div class="body">
        <div class="sidebar"></div>
        <div class="main">
          <div class="notes">
            <aside class="files-pane"></aside>
            <div class="editor-area">
              <div class="editor-header"></div>
              <div class="editor-body">
                <div class="editor-host" id="mount"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      window.__layout = null;
      try {
        new Vditor(document.getElementById("mount"), {
          height: "100%",
          mode: "ir",
          theme: "classic",
          lang: "zh_CN",
          icon: "ant",
          cdn: "/vditor",
          value: "# 标题\n\n段落内容。",
          cache: { enable: false },
          counter: { enable: false },
          outline: { enable: false, position: "right" },
          toolbar: ["undo", "redo", "|", "headings", "bold", "italic", "|", "list", "ordered-list", "quote", "|", "edit-mode"]
        });
      } catch (e) {
        window.__layout = { error: e.message };
      }
      setTimeout(() => {
        const measure = (sel) => {
          const el = document.querySelector(sel);
          if (!el) return null;
          const r = el.getBoundingClientRect();
          return { h: Math.round(r.height), w: Math.round(r.width) };
        };
        window.__layout = {
          viewport: { h: window.innerHeight, w: window.innerWidth },
          body: measure(".body"),
          main: measure(".main"),
          notes: measure(".notes"),
          filesPane: measure(".files-pane"),
          editorArea: measure(".editor-area"),
          editorBody: measure(".editor-body"),
          editorHost: measure(".editor-host"),
          vditor: measure(".vditor"),
          vditorContent: measure(".vditor-content"),
          vditorIr: measure(".vditor-ir"),
          vditorToolbar: measure(".vditor-toolbar"),
        };
      }, 4000);
    </script>
  </body>
</html>
