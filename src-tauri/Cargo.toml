[package]
name = "toolbox"
version = "0.1.0"
description = "ToolBox ? ??????????Rust ???"
edition = "2021"

# 继承 workspace lints（linker_messages 放行等，见根 Cargo.toml [workspace.lints]）
[lints]
workspace = true

[lib]
name = "toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon / image-png ? tauri ?? features???????
# ?features= [] ???????? tauri::tray ? Image ??????
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2"
# ????????????????????Windows ????? Mutex?
# ???????????????????????
tauri-plugin-single-instance = "2"
# M7 ?????Markdown ? HTML
pulldown-cmark = "0.12"
# M8 ?????????????????
trash = "5"
# ???????????/??
tauri-plugin-window-state = "2"
# ????????? cdylib?Windows DLL?
libloading = "0.9"
# ???? C ABI ???????? tb_sdk ??? JSON?
tb-sdk = { path = "../tb-sdk" }
# ???? DLL ?????????? .zip ????zip-slip ??? enclosed_name?
zip = "4"
# ???????????SQLite FTS5 trigram ???bundled-full ??????
rusqlite = { version = "0.40", features = ["bundled-full"] }
pinyin = "0.11.0"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-updater = "2.10.1"
arboard = "3"
reqwest = { version = "0.13", features = ["blocking"] }

# Windows ??? WebView2 ???Tauri 2 ????
[target.'cfg(windows)'.dependencies]
# ?????????????DwmSetWindowAttribute(DWMWA_CAPTION_COLOR)?
# ?????????????????Windows 11 ???????????
windows-sys = { version = "0.61", features = ["Win32_Graphics_Dwm", "Win32_Foundation"] }
# ??????HWND???????tauri ?????????????????
raw-window-handle = "0.6"

