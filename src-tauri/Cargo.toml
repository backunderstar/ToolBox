[package]
name = "toolbox"
version = "0.1.0"
description = "ToolBox — 个人工具箱桌面应用（Rust 核心）"
edition = "2021"

[lib]
name = "toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2"
# M6 AI：OpenAI 兼容 API 调用（阻塞版 + rustls，避免系统 OpenSSL）
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# M7 博客预览：内置静态文件服务器
tiny_http = "0.12"
# M7 博客生成：Markdown → HTML
pulldown-cmark = "0.12"
# M8 项目文件管理：删除项目进系统回收站
trash = "5"
# 浮窗清单：记忆窗口位置/大小
tauri-plugin-window-state = "2"

# Windows 上链接 WebView2 需要，Tauri 2 默认启用
[target.'cfg(windows)'.dependencies]
