[package]
name = "toolbox"
version = "0.1.0"
description = "ToolBox — 个人工具箱桌面应用（Rust 核心）"
edition = "2021"

[lib]
name = "toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon / image-png 是 tauri 默认 features，必须显式声明
# （features= [] 会覆盖默认，导致 tauri::tray 与 Image 解码不可用）
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2"
# 单实例：第二实例退出并在首实例触发回调（Windows 内部即命名 Mutex，
# 与之前手写实现同机制，由官方维护；跨平台可用）
tauri-plugin-single-instance = "2"
# M6 AI：OpenAI 兼容 API 调用（阻塞版 + rustls，避免系统 OpenSSL）
# stream：流式响应（SSE 逐块读取）需要
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
# M7 博客生成：Markdown → HTML
pulldown-cmark = "0.12"
# M8 项目文件管理：删除项目进系统回收站
trash = "5"
# 浮窗清单：记忆窗口位置/大小
tauri-plugin-window-state = "2"
# 核心插件：动态加载 cdylib（Windows DLL）
libloading = "0.8"
# 核心插件 C ABI 契约（宿主侧解析 tb_sdk 返回的 JSON）
tb-sdk = { path = "../tb-sdk" }
# 全文搜索（宿主内嵌）：SQLite FTS5 trigram 索引（bundled-full 免系统依赖）
rusqlite = { version = "0.40", features = ["bundled-full"] }

# Windows 上链接 WebView2 需要，Tauri 2 默认启用
[target.'cfg(windows)'.dependencies]
